<!DOCTYPE html><html lang="ar" dir="rtl" data-mode="store"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DH store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0a0e;--card:#2a1117;--tx:#f5e9e1;--mut:#b99a98;--gold:#d4a97a;--acc:#d4a97a;--on:#2a0a10;--ln:#44222a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#fbf6f1;--card:#fff;--tx:#2a0f14;--mut:#7a5a5f;--gold:#9a6b3f;--acc:#6b0f1f;--on:#fff;--ln:#ecdcd8;color-scheme:light}}
:root[data-theme="light"]{--bg:#fbf6f1;--card:#fff;--tx:#2a0f14;--mut:#7a5a5f;--gold:#9a6b3f;--acc:#6b0f1f;--on:#fff;--ln:#ecdcd8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--ln)}
.mono{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:700 16px Georgia,serif;color:var(--gold)}
.brand{font:700 20px Georgia,serif;color:var(--gold);letter-spacing:3px;flex:1}.brand small{display:block;font:400 10px Cairo;letter-spacing:1px;color:var(--mut)}
.btn{border:0;border-radius:10px;background:var(--acc);color:var(--on);padding:9px 16px;font:700 14px Cairo,sans-serif;cursor:pointer}
.btn.o{background:none;border:1px solid var(--gold);color:var(--gold)}.btn.w{width:100%}
main{max-width:980px;margin:auto;padding:12px}
.hero{border:1px solid var(--ln);border-radius:18px;padding:30px 18px;text-align:center;background:radial-gradient(circle at 50% 0,#7d142844,transparent 70%),var(--card)}
.hero h1{margin:0 0 6px;font:700 26px Georgia,Cairo,serif;color:var(--gold)}.hero p{margin:0 0 14px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.chip{flex:none;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:20px;padding:7px 16px;font:600 14px Cairo,sans-serif}.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}@media(min-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:820px){.grid{grid-template-columns:repeat(3,1fr)}}
.p{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.p img,.noimg{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#3a1620}.noimg{display:grid;place-items:center;color:var(--gold);font:700 36px Georgia}
.pi{padding:12px}.pi h3{margin:0 0 8px;font-size:16px}
.sz{display:flex;gap:6px;flex-wrap:wrap}.sz button{min-width:42px;padding:6px 8px;border:1px solid var(--ln);background:none;color:var(--tx);border-radius:8px;font:600 13px Cairo}
.sz button.on{background:var(--gold);color:#2a0a10;border-color:var(--gold)}.sz button:disabled{opacity:.35;text-decoration:line-through}
.pr{margin:10px 0 2px;font-size:20px;font-weight:700;color:var(--gold)}.info{font-size:13px;color:var(--mut);margin-bottom:10px;min-height:36px}
#ov{display:none;position:fixed;inset:0;background:#000a;z-index:20}#dr{position:absolute;top:0;bottom:0;left:0;width:min(400px,94%);background:var(--card);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px;flex-wrap:wrap}.row small{display:block;color:var(--mut)}
input,select,textarea{width:100%;margin:5px 0;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.box{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-top:14px}.box h2{margin:0 0 8px;font-size:17px;color:var(--gold)}
.g2{display:grid;grid-template-columns:50px 1fr 1fr;gap:6px;align-items:center}.g2 input{margin:2px 0}
.thumb{width:56px;height:70px;object-fit:cover;border-radius:8px}.tag{font-size:12px;color:var(--mut)}
.msg{padding:40px 16px;text-align:center;color:var(--mut)}
.bar{display:flex;gap:8px;margin-top:14px}.bar input{flex:1;margin:0}.bar select{width:130px;margin:0}
.fv{position:absolute;top:8px;left:8px;z-index:2;border:0;background:#0007;color:#fff;border-radius:50%;width:34px;height:34px;font-size:16px}
.bd{position:absolute;top:8px;right:8px;z-index:2;background:var(--gold);color:#2a0a10;border-radius:8px;padding:2px 10px;font:700 12px Cairo}
.wa{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;z-index:9;background:#25a244;color:#fff;border-radius:24px;padding:10px 16px;font:700 14px Cairo;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}.st span{color:var(--mut);font-size:13px}.st b{display:block;font-size:22px;color:var(--gold);margin-top:4px}
#wel{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 30%,#7d1428 0,#1c0a0e 75%);color:#f5e9e1;text-align:center;animation:fi 1.2s}
#wel .btn.o{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;padding:6px 12px;color:#d4a97a;border-color:#d4a97a}
.wc{max-width:340px;width:100%}.wc h1{margin:12px 0 0;font:700 26px Georgia;letter-spacing:5px;color:#d4a97a}
.mono.big{width:84px;height:84px;font-size:30px;margin:0 auto;color:#d4a97a;border-color:#d4a97a;animation:pl 3s infinite}
.wm{min-height:70px;font:700 20px Georgia,Cairo,serif;color:#f5e9e1;transition:opacity .6s;margin:18px 0;display:flex;align-items:center;justify-content:center}
.wp{color:#e8d5c8}#wel .btn{background:#d4a97a;color:#2a0a10}#wel .btn.o{background:none}#wel input{background:#2a1117;color:#f5e9e1;border-color:#5a2a33}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes pl{50%{box-shadow:0 0 28px #d4a97a66}}
header{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 85%,transparent)}
.brand{font-family:"Playfair Display",Georgia,serif}
.hero{position:relative;overflow:hidden;padding:40px 18px;background:linear-gradient(135deg,#5a0f1f,#2a0a10 60%,#7d1428);border:1px solid #d4a97a55}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ffffff07 0 2px,transparent 2px 14px)}.hero>*{position:relative}
.hero h1{font-family:"Playfair Display",Cairo,serif;font-size:30px;background:linear-gradient(90deg,#f3d9b8,#d4a97a,#f3d9b8);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#e6cfc3}
.hero .mono{color:#d4a97a;border-color:#d4a97a}.hero .btn.o{color:#f3d9b8;border-color:#d4a97a}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 0}.trust div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mut)}.trust b{display:block;font-size:20px}
.p{border-radius:18px;transition:transform .25s,box-shadow .25s,border-color .25s;animation:up .5s both}.p:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0005;border-color:var(--gold)}
.p .main{transition:transform .5s;cursor:zoom-in}.p:hover .main{transform:scale(1.03)}
.th{display:flex;gap:5px;padding:6px 8px;background:var(--card);overflow-x:auto}.p .th img{width:44px;height:56px;aspect-ratio:auto;border-radius:6px;cursor:pointer;flex:none;border:1px solid var(--ln)}
.pr{font-size:21px}.btn{transition:filter .2s,transform .1s}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.chip{padding:8px 18px}.sec{font:700 19px Cairo;margin:20px 0 4px;color:var(--gold)}
.cb{position:relative}.cb i{position:absolute;top:-7px;left:-7px;background:#e0455f;color:#fff;border-radius:50%;min-width:18px;height:18px;font:700 11px/18px Cairo;text-align:center;font-style:normal}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px 12px 60px;border-top:1px solid var(--ln);margin-top:24px}
h2[id]{scroll-margin-top:70px}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
html[data-mode=store] #hm{display:none}
</style></head><body>
<header><div class="mono">DH</div><div class="brand">DH STORE<small>أزياء وعبايات حريمي</small></div><button class="btn o" id="hm" onclick="home()">🏠</button><button class="btn o" id="mu" onclick="music(!musicOn)">🔇</button><span id="top"></span></header>
<main id="m"><div class="msg">جاري التحميل...</div></main>
<div id="wel"><button id="snd" class="btn o" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">🔊</button><div class="wc"><div class="mono big">DH</div><h1>DH STORE</h1><div id="wm" class="wm"></div><div id="wn" style="font-size:12px;color:#b99a98;min-height:18px"></div><div id="wb"><button class="btn" onclick="startW()">اضغط للدخول ✨</button></div></div></div><a id="wa" class="wa" target="_blank" rel="noopener" style="display:none">💬 تواصل واتساب</a><div id="ov" onclick="if(event.target==this)cl()"><div id="dr"></div></div>
<script>window.fbR=new Promise(r=>window.fbRes=r)</script>
<script>
const MODE=document.documentElement.dataset.mode||"store";
const SZ=["S","M","L","XL","2XL","3XL"],CATS=["عبايات","أطقم"],$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let db,asset,P=[],O=[],K=[],CH={},cart=[],cat="الكل",sel={},isAdm=false,chFilled=0,SH={},q="",sort="",fav=new Set(),favOnly=false,shFilled=0;
const hashAdm=()=>location.hash=="#merchant";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function init(){try{cart=JSON.parse(localStorage.getItem("dhc")||"[]")}catch(e){}
 try{await fbR;db=window.DBX}catch(e){}
 if(!db){$("wb").innerHTML='<p class="wp">تعذر الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase داخل الملف.</p>';return}
 if(db.local)$("wn").textContent=window.FB_FAIL?"⚠️ تعذر الاتصال بـ Firebase — الموقع شغال محليًا":"💾 وضع محلي: البيانات محفوظة على هذا الجهاز فقط";
 db.collection("products").onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));isAdm?aList():cust()});
 db.collection("settings").onSnapshot(s=>{const d=s.docs.find(x=>x.id=="chart"),e=s.docs.find(x=>x.id=="shop"),a=s.docs.find(x=>x.id=="auth");CH=d?d.data():{};SH=e?e.data():{};VC=(s.docs.find(x=>x.id=="voice")||{data:()=>null}).data();if(isAdm){if(!chFilled&&d){fillCh();chFilled=1}if(e&&!shFilled&&$("shw")){$("shw").value=SH.wa||"";$("shs").value=SH.ship||"";$("shf").value=SH.free||"";$("shg").value=SH.govs||"";shFilled=1}}else cust()});
if(MODE=="merchant"){$("hm").textContent="خروج";$("wm").textContent="";merchantV()}else cust()}
/* ---------- CUSTOMER ---------- */
function guide(){op(`<h3>دليل المقاسات</h3>`+SZ.map(s=>`<div class="row"><b>${s}</b><span>${esc(CH[s]||"—")}</span></div>`).join("")+`<button class="btn w" style="margin-top:12px" onclick="cl()">إغلاق</button>`)}
const gv=()=>{const m={};String(SH.govs||"").split("\n").forEach(l=>{const[k,v]=l.split("=");if(k&&v&&!isNaN(+v))m[k.trim()]=+v});return m};let GS="";
const shipFor=s=>(+SH.free&&s>=+SH.free)?0:(GS&&gv()[GS]!=null?gv()[GS]:(+SH.ship||0));
function govC(v){GS=v;const k=["n","ph","ad"].map(i=>$(i)?$(i).value:"");cartV();["n","ph","ad"].forEach((i,x)=>{if($(i))$(i).value=k[x]})}
function trk(){op(`<h3>تتبع الطلب</h3><input id="tc" placeholder="اكتب رقم الطلب"><button class="btn w" onclick="trGo()">بحث</button><div id="tr" style="margin-top:10px"></div>`)}
async function trGo(){const c=$("tc").value.trim();if(!c)return;try{const d=await db.collection("track").doc(c).get();$("tr").innerHTML=d?`<div class="msg"><h3>${ST[d.status]||"—"}</h3>آخر تحديث: ${new Date(d.upd||d.ts).toLocaleDateString("ar-EG")}</div>`:'<div class="msg">لا يوجد طلب بهذا الرقم</div>'}catch(e){$("tr").innerHTML='<div class="msg">تعذر البحث</div>'}}
function imgBlock(p){const L=p.imgs&&p.imgs.length?p.imgs:(p.img?[p.img]:[]);if(!L.length)return'<div class="noimg">DH</div>';return`<img class="main" src="${esc(L[0])}" alt="" onclick="zoom(this.src)">`+(L.length>1?`<div class="th">${L.map(u=>`<img src="${esc(u)}" alt="" onclick="this.closest('.p').querySelector('.main').src=this.src">`).join("")}</div>`:"")}
function zoom(s){op(`<img src="${s}" alt="" style="width:100%;border-radius:12px"><button class="btn w" style="margin-top:10px" onclick="cl()">إغلاق</button>`)}
function go(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:"smooth"})}
function minP(p){return Math.min(...Object.values(p.sizes||{}).map(z=>z.price),1e9)}
function cust(){if(MODE=="merchant")return;try{localStorage.setItem("dhc",JSON.stringify(cart))}catch(e){}
 if(!$("gr")){$("m").innerHTML=`<div class="hero"><div class="mono" style="margin:0 auto 10px;width:56px;height:56px;font-size:20px">DH</div><h1>أناقة بلمسة ذهبية</h1><p>عبايات وأطقم حريمي · شحن لكل المحافظات</p><button class="btn o" onclick="custV()">✂️ طلب خاص بأطوال مختلفة</button></div><div class="trust"><div><b>🚚</b>شحن لكل المحافظات</div><div><b>💵</b>الدفع عند الاستلام</div><div><b>🔎</b>تتبع طلبك</div></div><div class="bar"><input id="sq" placeholder="🔍 ابحثي عن منتج" oninput="q=this.value;cust()"><select onchange="sort=this.value;cust()"><option value="">الأحدث</option><option value="lo">الأقل سعرًا</option><option value="hi">الأعلى سعرًا</option></select></div><div class="chips" id="cc"></div><div class="sec">المنتجات</div><div class="grid" id="gr"></div><footer>DH store · أزياء وعبايات حريمي</footer>`}
 $("top").innerHTML=`<button class="btn cb" onclick="cartV()">🛍 السلة${cart.length?`<i>${cart.reduce((a,b)=>a+b.q,0)}</i>`:""}</button>`;
 $("cc").innerHTML=["الكل",...CATS].map(c=>`<button class="chip ${c==cat?"on":""}" onclick="cat='${c}';cust()">${c}</button>`).join("")+`<button class="chip ${favOnly?"on":""}" onclick="favOnly=!favOnly;cust()">❤ المفضلة</button><button class="chip" onclick="guide()">📏 دليل المقاسات</button><button class="chip" onclick="trk()">🔎 تتبع طلبي</button>`;
 const f=P.filter(p=>!p.hidden&&(cat=="الكل"||p.cat==cat)&&(!favOnly||fav.has(p.id))&&p.name.includes(q)).sort((a,b)=>sort=="lo"?minP(a)-minP(b):sort=="hi"?minP(b)-minP(a):0);
 $("gr").innerHTML=f.map(card).join("")||'<div class="msg">لا توجد منتجات</div>';
 const w=$("wa"),n=String(SH.wa||"").replace(/\D/g,"");if(n){w.href="https://wa.me/"+n;w.style.display="block"}}
function card(p){const s=sel[p.id],z=s&&p.sizes[s],nw=Date.now()-(p.ts||0)<6048e5;
 return`<div class="p" style="position:relative">${nw?'<span class="bd">جديد</span>':""}<button class="fv" onclick="fav.has('${p.id}')?fav.delete('${p.id}'):fav.add('${p.id}');cust()">${fav.has(p.id)?"❤":"🤍"}</button>${imgBlock(p)}<div class="pi"><h3>${esc(p.name)}</h3><div class="tag">${esc(p.desc||"")}</div>
 <div class="sz" style="margin-top:8px">${SZ.map(x=>{const q=p.sizes?.[x]?.qty||0,pr=p.sizes?.[x]?.price;return pr?`<button class="${s==x?"on":""}" ${q<1?"disabled":""} onclick="sel['${p.id}']='${x}';cust()">${x}</button>`:""}).join("")}</div>
 <div class="pr">${z?z.price+" ج.م":"تبدأ من "+minP(p)+" ج.م"}</div>
 <div class="info">${z?(z.qty<=3?`<b style="color:#e0707f">باقي ${z.qty} فقط!</b>`:`متوفر: ${z.qty} قطعة`)+"<br>"+esc(CH[s]||""):"اختاري المقاس لمعرفة السعر"}</div>
 <button class="btn w" ${z?"":"disabled"} onclick="add('${p.id}')">أضيفي للسلة</button></div></div>`}
function add(id){const p=P.find(x=>x.id==id),s=sel[id],z=p.sizes[s],i=cart.find(c=>c.id==id&&c.s==s);
 if(i){if(i.q<z.qty)i.q++}else cart.push({id,n:p.name,s,pr:z.price,q:1});cust()}
function op(h){$("dr").innerHTML=h;$("ov").style.display="block"}function cl(){$("ov").style.display="none"}
function cartV(){const sub=cart.reduce((a,c)=>a+c.pr*c.q,0),sh=shipFor(sub),t=sub+sh;
 op(`<h3>سلة المشتريات</h3>`+(cart.length?cart.map((c,i)=>`<div class="row"><span>${esc(c.n)}<small>مقاس ${c.s} · ${c.pr} ج.م</small></span><span><button class="chip" onclick="cart[${i}].q--;if(cart[${i}].q<1)cart.splice(${i},1);cust();cartV()">−</button> ${c.q} <button class="chip" onclick="cart[${i}].q++;cust();cartV()">+</button></span></div>`).join("")+
 `${Object.keys(gv()).length?`<select id="gv" onchange="govC(this.value)"><option value="">اختر المحافظة</option>${Object.keys(gv()).map(g=>`<option ${g==GS?"selected":""}>${esc(g)}</option>`).join("")}</select>`:""}<div class="row"><span>المنتجات</span><span>${sub} ج.م</span></div><div class="row"><span>الشحن</span><span>${sh?sh+" ج.م":"مجاني 🎉"}</span></div><div class="row"><b>الإجمالي</b><b>${t} ج.م</b></div><input id="hp" style="display:none" tabindex="-1" autocomplete="off"><input id="n" placeholder="الاسم"><input id="ph" type="tel" placeholder="رقم الموبايل"><input id="ad" placeholder="العنوان بالتفصيل"><button class="btn w" onclick="ord(${t})">تأكيد الطلب (الدفع عند الاستلام)</button>`:"<p>السلة فاضية</p>"))}
async function ord(t){if(($("hp")||{}).value)return;if(Object.keys(gv()).length&&!GS)return alert("اختر المحافظة");try{if(Date.now()-(+localStorage.getItem("dhl")||0)<60000)return alert("انتظر دقيقة قبل إرسال طلب جديد")}catch(e){}const n=$("n").value,ph=$("ph").value,ad=$("ad").value;if(!n||!ph||!ad)return alert("من فضلك أكملي كل البيانات");
